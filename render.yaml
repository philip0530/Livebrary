# Render Blueprint. New > Blueprint, then connect the Git repository.
# Free Postgres expires 30 days after creation. The free web service sleeps after 15 idle minutes.
services:
  - type: web
    name: livebrary
    runtime: node
    plan: free
    region: singapore
    buildCommand: sh scripts/render-build.sh
    startCommand: npm run db:migrate && npm run db:seed && npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: livebrary
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_CODE_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_FALLBACK_CODE
        value: Trust
      - key: ADMIN_CODE_ROTATION_TIMEZONE
        value: Asia/Seoul
      - key: DISCORD_LOG_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        sync: false
      - key: RIYAN_SYNC_KEY
        sync: false
      # Riyan Discord bot can run inside this service (apps/riyan-bot), but Discord often rate-limits
      # Render's shared IPs (HTTP 429 on login), so it stays off and the bot runs on the PC instead.
      - key: RIYAN_BOT_ENABLED
        value: "false"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_NOTICE_CHANNEL_ID
        sync: false
      - key: DISCORD_DEVELOPER_CODE_CHANNEL_ID
        sync: false
      - key: DISCORD_ACTIVITY_CHANNEL_ID
        sync: false
      - key: DISCORD_SECURITY_CHANNEL_ID
        sync: false
      - key: DISCORD_VERIFIED_ROLE_ID
        sync: false
      - key: DISCORD_OPERATOR_IDS
        sync: false
      - key: LIVEBRARY_ADMIN_USER_IDS
        sync: false

databases:
  - name: livebrary
    plan: free
    region: singapore
    databaseName: livebrary
    user: livebrary
    postgresMajorVersion: "16"
